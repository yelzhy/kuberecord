version: "2"
run:
  allow-parallel-runners: true
  # Without this the tagged acceptance suites are invisible to the linter — and to
  # `go vet`, which `make build`/`make test` run over the default build only. The
  # e2e suite is the Phase 1 gate (Task 1.11) and the chaos suite is the Phase 2
  # failure-mode gate (Task 2.1); "make lint passes" has to mean something for both.
  build-tags:
    - e2e
    - chaos
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    depguard:
      rules:
        # Task 0.5 acceptance criterion: the code that hands records to a sink
        # must depend on the generic sink contract (internal/sink), never on the
        # ClickHouse driver directly. Task 1.5 moved that code out of
        # internal/controller (per-GVK reconcilers) and into internal/pipeline
        # (workqueue + workers), so the guarantee is enforced on both paths: the
        # pipeline today, and the control-plane reconcilers that Task 1.7 puts
        # back under internal/controller — which per Invariant 1 must never dial
        # ClickHouse at all. Source and test files alike.
        data-plane-no-clickhouse:
          files:
            - "**/internal/pipeline/**"
            - "**/internal/controller/**"
            - "**/internal/watch/**"
          deny:
            - pkg: github.com/ClickHouse/clickhouse-go/v2
              desc: "the data plane and control plane must depend on internal/sink, not the ClickHouse driver (Task 0.5)"

        # Task 5.1 acceptance criterion: the Writer conformance suite is built
        # around the contract in internal/sink, not around any backend's
        # implementation of it. internal/pipeline is denied because it imports
        # internal/sink (so the dependency can only run one way, and a test
        # binary reaching back would be an import cycle waiting to happen), and
        # the ClickHouse packages because a suite that quietly certified one
        # backend against another's behaviour would gate nothing (D11).
        conformance-suite-is-backend-agnostic:
          files:
            - "**/internal/sink/conformance/**"
          deny:
            - pkg: github.com/yelzhy/kuberecord/internal/pipeline
              desc: "the conformance suite must depend only on the sink contract; internal/sink cannot import internal/pipeline (Task 5.1)"
            - pkg: github.com/yelzhy/kuberecord/internal/sink/clickhouse
              desc: "the conformance suite must name no backend: it is the contract every backend is measured against (Task 5.1)"
            - pkg: github.com/ClickHouse/clickhouse-go/v2
              desc: "the conformance suite must name no backend: it is the contract every backend is measured against (Task 5.1)"
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
